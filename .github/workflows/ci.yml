name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: |
            operator/go.sum
            agent/go.sum
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Contract tests
        working-directory: contracts
        run: forge test
      - name: Go tests and vet
        working-directory: agent
        run: |
          go test ./...
          go vet ./...
      - name: Operator agent
        working-directory: operator
        run: |
          go test ./...
          go vet ./...
          go run ./cmd/pulse demo
      - name: Local payment and restart demo
        run: python3 scripts/local-demo.py

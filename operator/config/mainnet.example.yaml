# Example only. Nothing in this file spends. Fill addresses after a new vault deploy.
# Run: CONFIRM_MAINNET=1 go run ./cmd/pulse bill run --config config/mainnet.example.yaml --id <bill> --i-understand-real-money --yes
mode: mainnet
agentID: pulse-operator
chainID: "5042"
vault: "0x0000000000000000000000000000000000000000"
agent: "0x0000000000000000000000000000000000000000"
usdc: "0x3600000000000000000000000000000000000000"
chainDriver: rpc
ledger: testdata/ledger.yaml
auditLog: data/audit-mainnet.jsonl
dueHorizon: 168h
cooldown: 1h
reserveFloorUSDC: "0"
reserveTargetUSDC: "0"
listen: 127.0.0.1
loopEnabled: false
maxSpendPerRunUSDC: "15"
maxBillUSDC: "15"
executor: circle-wallets
planner:
  driver: gateway
  model: openai/gpt-5.4-nano
  baseURL: https://ai-gateway.vercel.sh/v1
  apiKeyEnv: AI_GATEWAY_API_KEY
  timeout: 20s
  jevKeyEnv: JEV_API_KEY
  jevURL: https://api.typesafe.ai/v1/systemone
  jevModel: jev-latest
porkbun:
  apiBase: https://api.porkbun.com/api/json/v3
  apiKeyEnv: PORKBUN_API_KEY
  secretEnv: PORKBUN_SECRET_API_KEY
  monthlyLimitCents: 10000
  dailyCap: 10
  priceToleranceCents: 0
  feeBufferUSDC: "0.02"
procurement:
  address: "0x0000000000000000000000000000000000000000"
  walletIDEnv: CIRCLE_PROCUREMENT_WALLET_ID
  keyEnv: PROCUREMENT_PRIVATE_KEY
base:
  chainID: "8453"
  rpcEnv: BASE_RPC_URL
  usdc: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
cctpBridge:
  forward: true
  allowStandard: false
  feeLevel: med
  sourceDomain: 26
  destDomain: 6
  tokenMessenger: "0x28b5a0e9C621a5BadaA536219b3a228C8168cf5d"
secrets:
  rpcEnv: ARC_RPC_URL
  agentKeyEnv: OPERATOR_PRIVATE_KEY
  ownerKeyEnv: OWNER_PRIVATE_KEY
gas:
  maxFeePerGasGwei: 50
  maxPriorityFeePerGasGwei: 2
circle:
  blockchain: ARC
  apiBase: https://api.circle.com
  irisBase: https://iris-api.circle.com
  apiKeyEnv: CIRCLE_API_KEY
  entitySecretEnv: CIRCLE_ENTITY_SECRET
  walletIDEnv: CIRCLE_WALLET_ID
  ownerWalletIDEnv: CIRCLE_OWNER_WALLET_ID
  feeLevel: MEDIUM
